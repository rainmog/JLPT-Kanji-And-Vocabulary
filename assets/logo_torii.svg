  <!-- Left pillar -->
  <rect x="160" y="129" width="17" height="80" rx="4" fill="#D4607A"/>
  <!-- Right pillar -->
  <rect x="223" y="129" width="17" height="80" rx="4" fill="#D4607A"/>
  <!-- Nuki: crossbar -->
  <rect x="153" y="152" width="94" height="11" rx="3" fill="#D4607A"/>

  <line x1="130" y1="220" x2="270" y2="220"
        stroke="#E8A0B4" stroke-width="1" opacity="0.55"/>

  <text x="200" y="292" text-anchor="middle"
