<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">

  <!-- Background: soft sakura blush -->
  <rect width="400" height="400" fill="#FEF0F5" rx="56"/>

  <!-- Sakura flower — 5 elliptical petals around center (200,148) -->
  <g transform="translate(200,148)">
    <ellipse cx="0" cy="-36" rx="17" ry="32" fill="#FFB7C5" transform="rotate(0)"/>
    <ellipse cx="0" cy="-36" rx="17" ry="32" fill="#FFB7C5" transform="rotate(72)"/>
    <ellipse cx="0" cy="-36" rx="17" ry="32" fill="#FFB7C5" transform="rotate(144)"/>
    <ellipse cx="0" cy="-36" rx="17" ry="32" fill="#FFB7C5" transform="rotate(216)"/>
    <ellipse cx="0" cy="-36" rx="17" ry="32" fill="#FFB7C5" transform="rotate(288)"/>
    <!-- Center -->
    <circle cx="0" cy="0" r="15" fill="#F2C2CF"/>
    <circle cx="0" cy="0" r="5"  fill="#D4849A"/>
  </g>

  <!-- Thin divider -->
  <line x1="130" y1="220" x2="270" y2="220"
        stroke="#E8A0B4" stroke-width="1" opacity="0.55"/>

  <!-- JLPT -->
  <text x="200" y="292"
        text-anchor="middle"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="70"
        font-weight="800"
        fill="#4A2040">JLPT</text>

  <!-- Subtitle -->
  <text x="200" y="322"
        text-anchor="middle"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="13"
        font-weight="400"
        letter-spacing="5"
        fill="#C07090">KANJI STUDY</text>

</svg>
