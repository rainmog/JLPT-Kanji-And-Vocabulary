<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">

  <!-- Off-white background: warm tint gives better contrast than pure white -->
  <rect width="400" height="400" fill="#FFFAF9" rx="56"/>

  <!-- Open book (scaled +15%, centered at 200,155) -->
  <!-- Left page -->
  <rect x="106" y="98" width="88" height="115" rx="7" fill="#F2C2CF"/>
  <!-- Right page -->
  <rect x="202" y="98" width="88" height="115" rx="7" fill="#FFD6E0"/>
  <!-- Spine -->
  <rect x="194" y="98" width="12" height="115" fill="#D4849A"/>

  <!-- Text lines on left page -->
  <line x1="120" y1="124" x2="182" y2="124" stroke="#C07090" stroke-width="2.8" stroke-linecap="round"/>
  <line x1="120" y1="140" x2="182" y2="140" stroke="#C07090" stroke-width="2.8" stroke-linecap="round"/>
  <line x1="120" y1="156" x2="182" y2="156" stroke="#C07090" stroke-width="2.8" stroke-linecap="round"/>
  <line x1="120" y1="172" x2="163" y2="172" stroke="#C07090" stroke-width="2.8" stroke-linecap="round"/>

  <!-- Kanji on right page -->
  <text x="248" y="170" text-anchor="middle"
        font-family="'Noto Serif CJK JP','Yu Mincho','Hiragino Mincho ProN',serif"
        font-size="51" font-weight="700"
        fill="#8A4060">語</text>

  <line x1="130" y1="224" x2="270" y2="224"
        stroke="#E8A0B4" stroke-width="1" opacity="0.55"/>

  <text x="200" y="294" text-anchor="middle"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="70" font-weight="800" fill="#4A2040">JLPT</text>

  <text x="200" y="324" text-anchor="middle"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="13" font-weight="400" letter-spacing="5"
        fill="#C07090">KANJI STUDY</text>

</svg>
