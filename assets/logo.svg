<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">

  <!-- Background -->
  <rect width="400" height="400" fill="#F0EBE0" rx="56"/>

  <!-- Ears -->
  <polygon points="118,168  90,72  180,152" fill="#D95A20"/>
  <polygon points="282,168  310,72  220,152" fill="#D95A20"/>
  <!-- Ear inner -->
  <polygon points="128,160  108,94  172,148" fill="#A01828"/>
  <polygon points="272,160  292,94  228,148" fill="#A01828"/>

  <!-- Head -->
  <circle cx="200" cy="196" r="100" fill="#D95A20"/>

  <!-- Face white patch -->
  <ellipse cx="200" cy="214" rx="58" ry="52" fill="#F5E6C8"/>

  <!-- Eyes -->
  <circle cx="172" cy="182" r="13" fill="#1E1830"/>
  <circle cx="228" cy="182" r="13" fill="#1E1830"/>
  <circle cx="177" cy="177" r="4" fill="white"/>
  <circle cx="233" cy="177" r="4" fill="white"/>

  <!-- Nose -->
  <ellipse cx="200" cy="206" rx="7" ry="5" fill="#1E1830"/>

  <!-- Cheeks -->
  <ellipse cx="156" cy="210" rx="16" ry="10" fill="#E06030" opacity="0.35"/>
  <ellipse cx="244" cy="210" rx="16" ry="10" fill="#E06030" opacity="0.35"/>

  <!-- Mouth open to hold card -->
  <path d="M 182,222 Q 200,234 218,222" stroke="#1E1830" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- Flashcard sticking out of mouth -->
  <!-- Card -->
  <rect x="152" y="228" width="96" height="68" rx="5" fill="#FFFEF5" stroke="#A01828" stroke-width="4"/>
  <!-- Inner border -->
  <rect x="160" y="236" width="80" height="52" rx="3" fill="none" stroke="#A01828" stroke-width="1.5"/>
  <!-- Kanji -->
  <text x="200" y="274"
        text-anchor="middle"
        font-family="'Noto Serif CJK JP','Yu Mincho','Hiragino Mincho ProN',serif"
        font-size="34"
        fill="#1E1830"
        font-weight="bold">漢字</text>

  <!-- Paws (simple) -->
  <ellipse cx="156" cy="290" rx="28" ry="16" fill="#D95A20" transform="rotate(-20,156,290)"/>
  <ellipse cx="244" cy="290" rx="28" ry="16" fill="#D95A20" transform="rotate(20,244,290)"/>

  <!-- Tail peek bottom -->
  <path d="M 280,340 Q 360,310 350,380 Q 340,420 268,400 Q 228,385 280,340 Z" fill="#D95A20"/>
  <path d="M 288,350 Q 344,332 336,382 Q 328,408 276,392 Q 252,382 288,350 Z" fill="#F5E6C8"/>

</svg>
